plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.pro.giavdn.homechicken'
    compileSdk 34

    defaultConfig {
        applicationId "vn.pro.giavdn.homechicken"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def keystorePropertiesFile = rootProject.file("keystore.properties")
            if (keystorePropertiesFile.exists()) {
                def props = new java.util.Properties()
                keystorePropertiesFile.withInputStream { props.load(it) }
                def cleanProps = [:]
                props.each { k, v ->
                    cleanProps[k.toString().replace('\uFEFF', '').trim()] = v
                }
                if (cleanProps['storeFile']) {
                    storeFile file(cleanProps['storeFile'])
                    storePassword cleanProps['storePassword']
                    keyAlias cleanProps['keyAlias']
                    keyPassword cleanProps['keyPassword']
                }
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def keystorePropertiesFile = rootProject.file("keystore.properties")
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'androidx.core:core:1.12.0'
}
